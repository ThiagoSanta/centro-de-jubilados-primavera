<!-- Favicon del sistema Centro de Jubilados Primavera.
     Usa el color primario del sistema (#1A1F3A) definido en main.css :root.
     Formato SVG para soporte moderno sin necesidad de ICO. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo cuadrado redondeado con el color primario del sidebar -->
  <rect width="32" height="32" rx="6" fill="#1A1F3A"/>
  <!-- Letra "P" de Primavera en color acento (#2563EB) del sistema -->
  <text
    x="8"
    y="24"
    font-family="sans-serif"
    font-size="22"
    font-weight="700"
    fill="#2563EB"
  >P</text>
</svg>
