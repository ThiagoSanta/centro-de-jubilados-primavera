<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Centro de Jubilados Primavera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A1F3A;
            --primary-light: #2A3154;
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            --bg-gradient: linear-gradient(135deg, #1A1F3A 0%, #0d1020 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --error-border: #fee2e2;
            --border-color: #e5e7eb;
            --border-focus: #3b82f6;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        /* Efectos de brillo ambiental en el fondo de la pantalla de login */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, rgba(99, 102, 241, 0) 70%);
            bottom: -150px;
            right: -150px;
            z-index: 0;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            z-index: 10;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-header {
            background-color: var(--primary);
            color: #ffffff;
            padding: 2.25rem 2.5rem 1.75rem 2.5rem;
            text-align: center;
            position: relative;
        }

        .login-header h1 {
            font-size: 1.25rem;
            line-height: 1.3;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            font-size: 0.875rem;
            color: #a1a1aa;
            font-weight: 400;
        }

        .login-body {
            padding: 2.5rem 2.5rem 3rem 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            transition: color 0.2s ease;
        }

        .form-group:focus-within label {
            color: var(--accent);
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: #9ca3af;
            pointer-events: none;
            transition: color 0.2s ease;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-icon svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            /* 0.95rem (~15.2px) alineado a 0.9375rem (15px) = --font-size-md del sistema.
               Valor literal porque login.html no carga main.css. */
            font-size: 0.9375rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--border-focus);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        .form-group:focus-within .input-icon {
            color: var(--accent);
        }

        /* Padding derecho del input de contraseña para dar espacio al botón ojo */
        #password {
            padding-right: 2.75rem;
        }

        /* Botón mostrar/ocultar contraseña */
        .toggle-password {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            flex-shrink: 0;
        }

        .toggle-password:hover {
            color: var(--accent);
        }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            /* 0.95rem (~15.2px) alineado a 0.9375rem (15px) = --font-size-md del sistema.
               Valor literal porque login.html no carga main.css. */
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            margin-top: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-submit:hover {
            background-color: var(--primary-light);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            margin-top: 1.5rem;
            padding: 0.875rem 1.125rem;
            background-color: var(--error-bg);
            color: var(--error-text);
            border-radius: 10px;
            font-size: 0.875rem;
            line-height: 1.45;
            border: 1px solid var(--error-border);
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        /* Spinner de carga que se muestra durante el proceso de autenticación */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }



        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script src="/centro-de-jubilados-primavera/public/assets/js/app.js"></script>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Centro de Jubilados Primavera</h1>
            <p>Acceso al Sistema de Gestión</p>
        </div>
        <div class="login-body">
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" class="form-control"
                            placeholder="Ingrese su usuario" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Ingrese su contraseña" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="toggle-password"
                            aria-label="Mostrar contraseña">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    <span class="spinner" id="btnSpinner"></span>
                    <span id="btnText">Iniciar sesión</span>
                </button>

                <div id="errorMessage" class="error-message"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Por favor complete todos los campos.');
                return;
            }

            hideError();
            setLoading(true);

            try {
                const response = await fetch(`${BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ username, password })
                });

                let result;
                try {
                    result = await response.json();
                } catch (parseErr) {
                    throw new Error('Error de comunicación con el servidor. Inténtelo de nuevo.');
                }

                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Error al iniciar sesión. Inténtelo de nuevo.');
                }

                const user = result.data;
                if (user.rol === 'administrador') {
                    window.location.href = `${BASE_URL}/views/dashboard/index.html`;
                } else if (user.rol === 'cobrador') {
                    window.location.href = `${BASE_URL}/views/cobrador/index.html`;
                } else {
                    throw new Error('Rol de usuario desconocido o no autorizado.');
                }
            } catch (err) {
                showError(err.message);
                setLoading(false);
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
        }

        function setLoading(isLoading) {
            const btnSubmit = document.getElementById('btnSubmit');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            if (isLoading) {
                btnSubmit.disabled = true;
                btnSpinner.style.display = 'inline-block';
                btnText.textContent = 'Iniciando sesión...';
            } else {
                btnSubmit.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.textContent = 'Iniciar sesión';
            }
        }

        // ── Botón mostrar/ocultar contraseña ─────────────────────────────────
        // Nombres únicos (btnTogglePassword, campoPassword) para no redeclarar
        // las constantes ya existentes en el scope del handler de submit.
        const btnTogglePassword = document.getElementById('togglePassword');
        const campoPassword     = document.getElementById('password');
        btnTogglePassword.addEventListener('click', function () {
            const visible = campoPassword.type === 'text';
            campoPassword.type = visible ? 'password' : 'text';
            this.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
            this.querySelector('svg').innerHTML = visible
                ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
                : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>'
                  + '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>'
                  + '<line x1="1" y1="1" x2="23" y2="23"/>';
        });
    </script>
</body>

</html>
