<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa General - Centro de Jubilados Primavera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/centro-de-jubilados-primavera/public/assets/css/main.css">
    <script src="/centro-de-jubilados-primavera/public/assets/js/app.js"></script>
    <link rel="stylesheet" href="/centro-de-jubilados-primavera/public/assets/vendor/leaflet/leaflet.css">
    <script src="/centro-de-jubilados-primavera/public/assets/vendor/leaflet/leaflet.js"></script>
    <style>
        .map-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }
        .map-header {
            background: var(--color-content);
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 0;
            z-index: 10;
        }
        .map-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
        }
        .map-wrapper {
            flex: 1;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .map-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--color-content);
            padding: 1.25rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border);
            width: 220px;
        }
        .map-overlay h3 {
            font-size: 0.875rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--color-text);
        }
        .map-overlay-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .map-overlay-group select {
            padding: 0.375rem 0.5rem;
            font-size: 0.8125rem;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--color-content);
            padding: 0.75rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border);
            font-size: 0.8125rem;
        }
        .legend div {
            display: flex;
            align-items: center;
            margin-bottom: 0.375rem;
            font-weight: 500;
        }
        .legend div:last-child {
            margin-bottom: 0;
        }
        .legend img {
            width: 15px;
            height: 25px;
            margin-right: 0.5rem;
        }

        /* ── Mobile Responsive (Mapa) ─────────────────────────── */
        .mobile-header-bar {
            display: none;
        }

        .btn-hamburger {
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 0.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-hamburger svg {
            width: 22px;
            height: 22px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1050;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }

            .mobile-header-bar {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.75rem 1rem;
                background: var(--color-sidebar);
                color: #ffffff;
                flex-shrink: 0;
                z-index: 100;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .mobile-header-bar__title {
                font-size: 0.9375rem;
                font-weight: 700;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 1100;
                transform: translateX(-100%);
                transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: var(--shadow-lg);
            }

            .sidebar.sidebar--open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: block;
            }

            .sidebar-overlay.sidebar-overlay--visible {
                opacity: 1;
                pointer-events: auto;
            }

            .map-header {
                padding: 0.75rem 1rem;
            }

            .map-header h1 {
                font-size: 1rem;
            }

            .map-overlay {
                top: 10px;
                right: 10px;
                width: 170px;
                padding: 0.65rem;
            }

            .legend {
                bottom: 10px;
                left: 10px;
                right: auto;
                padding: 0.5rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="layout">
        <!-- Mobile Header Bar -->
        <div class="mobile-header-bar">
            <button class="btn-hamburger" id="btnToggleSidebar" aria-label="Abrir menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <span class="mobile-header-bar__title">Mapa de Ruteo</span>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <div class="sidebar__brand-title">Centro Primavera</div>
                <div class="sidebar__brand-sub">Sistema de Gestión</div>
            </div>
            <nav class="sidebar__nav" id="sidebarNav">
                <!-- Se renderiza dinámicamente según el rol del usuario -->
            </nav>
            <div class="sidebar__footer">
                <button onclick="logout()" class="sidebar-nav-item sidebar__footer-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="map-container">
            <header class="map-header">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h1>Mapa General de Socios</h1>
                    <div style="display: flex; gap: 0.5rem;">
                        <a href="/centro-de-jubilados-primavera/public/views/planillas/generar.html" class="btn btn--secondary btn--sm">Generar Planilla</a>
                        <a href="/centro-de-jubilados-primavera/public/views/planillas/historico.html" class="btn btn--secondary btn--sm">Histórico</a>
                    </div>
                </div>
            </header>
            
            <div class="map-wrapper">
                <div id="map"></div>
                
                <div class="map-overlay">
                    <h3>Filtros</h3>
                    <div class="map-overlay-group">
                        <select id="zonaFilter" class="form-control">
                            <option value="">Todas las zonas</option>
                        </select>
                        <select id="estadoFilter" class="form-control">
                            <option value="">Todos los estados</option>
                            <option value="activo">Activo</option>
                            <option value="suspendido">Suspendido</option>
                            <option value="eliminado">Eliminado</option>
                        </select>
                        <select id="modalidadFilter" class="form-control">
                            <option value="">Todas las modalidades</option>
                            <option value="cobranza_domiciliaria">Domiciliaria</option>
                            <option value="pago_sede">Sede</option>
                            <option value="transferencia">Transferencia</option>
                        </select>
                        <button onclick="loadSocios()" class="btn btn--primary btn--sm" style="width: 100%;">Aplicar</button>
                    </div>
                </div>

                <div class="legend">
                    <div><img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png"> Activo</div>
                    <div><img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png"> Suspendido</div>
                    <div><img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png"> Eliminado</div>
                    <div><img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png"> Sin Geolocalizar</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var SIDEBAR_ADMIN = [
            {
                href: '/centro-de-jubilados-primavera/public/views/dashboard/index.html', label: 'Dashboard',
                icon: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/socios/padron.html', label: 'Socios',
                icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/pagos/listado.html', label: 'Cobranza',
                icon: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/planillas/generar.html', label: 'Planillas y Ruteo', active: true,
                icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/notificaciones/index.html', label: 'Notificaciones',
                icon: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/auditoria/index.html', label: 'Auditoría',
                icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/usuarios/index.html', label: 'Usuarios',
                icon: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/deuda/configuracion-cuota.html', label: 'Configuración',
                icon: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
            }
        ];

        var SIDEBAR_COBRADOR = [
            {
                href: '/centro-de-jubilados-primavera/public/views/cobrador/index.html', label: 'Inicio',
                icon: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/cobrador/socios.html', label: 'Socios',
                icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/pagos/cobro-sede.html', label: 'Cobro en sede',
                icon: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/cobrador/planillas.html', label: 'Mis planillas',
                icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>'
            },
            {
                href: '/centro-de-jubilados-primavera/public/views/planillas/mapa.html', label: 'Mapa de ruteo', active: true,
                icon: '<polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/>'
            }
        ];

        function renderSidebar(rol) {
            var items = (rol === 'cobrador') ? SIDEBAR_COBRADOR : SIDEBAR_ADMIN;
            var nav = document.getElementById('sidebarNav');
            if (!nav) return;
            nav.innerHTML = items.map(function (item) {
                var cls = 'sidebar-nav-item' + (item.active ? ' sidebar-nav-item--active' : '');
                return '<a href="' + item.href + '" class="' + cls + '">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + item.icon + '</svg>' +
                    item.label +
                    '</a>';
            }).join('');
        }

        let map;
        let markersGroup;

        async function init() {
            map = L.map('map').setView([-32.820366, -61.403157], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            
            markersGroup = L.layerGroup().addTo(map);

            const resZonas = await fetch(`${API_BASE}/zonas`);
            const dataZonas = await resZonas.json();
            const zonaSelect = document.getElementById('zonaFilter');
            dataZonas.data.forEach(z => {
                const opt = document.createElement('option');
                opt.value = z.id;
                opt.textContent = z.nombre;
                zonaSelect.appendChild(opt);
            });

            loadSocios();
        }

        async function loadSocios() {
            markersGroup.clearLayers();
            
            const zona = document.getElementById('zonaFilter').value;
            const estado = document.getElementById('estadoFilter').value;
            const mod = document.getElementById('modalidadFilter').value;
            
            let url = `${API_BASE}/socios?limit=10000`; 
            if (zona) url += `&zona_id=${zona}`;
            if (estado) url += `&estado=${estado}`;
            if (mod) url += `&modalidad_cobranza=${mod}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.success && data.data.data) {
                    let bounds = L.latLngBounds([[-32.820366, -61.403157]]);
                    
                    data.data.data.forEach(s => {
                        if (s.latitud && s.longitud) {
                            let color = 'grey';
                            if (!s.geolocalizacion_pendiente) {
                                if (s.estado === 'activo') color = 'green';
                                else if (s.estado === 'suspendido') color = 'gold';
                                else if (s.estado === 'eliminado') color = 'red';
                            }
                            
                            const marker = L.marker([s.latitud, s.longitud], {
                                icon: L.icon({
                                    iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
                                    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
                                })
                            });
                            
                            marker.bindPopup(`
                                <strong>${s.nombre_apellido}</strong><br>
                                N°: ${s.numero_socio}<br>
                                Dir: ${s.direccion}<br>
                                Zona: ${s.zona_nombre || 'N/A'}<br>
                                <a href="${BASE_URL}/views/socios/perfil.html?id=${s.id}" target="_blank" style="color: var(--color-accent); font-weight: 600; text-decoration: underline;">Ver perfil</a>
                            `);
                            
                            markersGroup.addLayer(marker);
                            bounds.extend([s.latitud, s.longitud]);
                        }
                    });
                    
                    if (data.data.data.length > 0) {
                        map.fitBounds(bounds, {padding: [30, 30]});
                    }
                }
            } catch (e) {
                console.error("Error cargando socios:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            fetch(API_BASE + '/auth/me')
                .then(function (res) {
                    if (!res.ok) throw new Error('No autenticado');
                    return res.json();
                })
                .then(function (res) {
                    if (!res.success || !res.data) {
                        window.location.href = BASE_URL + '/views/auth/login.html';
                        return;
                    }
                    renderSidebar(res.data.rol);
                    init();
                    initMobileSidebar();
                })
                .catch(function () {
                    window.location.replace(BASE_URL + '/views/auth/login.html');
                });
        });

        function initMobileSidebar() {
            var toggleBtn = document.getElementById('btnToggleSidebar');
            var overlay = document.getElementById('sidebarOverlay');
            var sidebar = document.querySelector('.sidebar');
            if (!toggleBtn || !overlay || !sidebar) return;

            function toggle() {
                var isOpen = sidebar.classList.toggle('sidebar--open');
                overlay.classList.toggle('sidebar-overlay--visible', isOpen);
                if (map) {
                    setTimeout(function () { map.invalidateSize(); }, 300);
                }
            }
            function close() {
                sidebar.classList.remove('sidebar--open');
                overlay.classList.remove('sidebar-overlay--visible');
                if (map) {
                    setTimeout(function () { map.invalidateSize(); }, 300);
                }
            }

            toggleBtn.addEventListener('click', toggle);
            overlay.addEventListener('click', close);
            sidebar.addEventListener('click', function (e) {
                if (e.target.closest('.sidebar-nav-item')) {
                    close();
                }
            });
        }
    </script>
</body>
</html>
