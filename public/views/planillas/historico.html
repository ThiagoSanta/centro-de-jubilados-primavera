<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Planillas - CJP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-green-800 text-white flex flex-col">
        <div class="p-4 bg-green-900">
            <h1 class="text-xl font-bold">CJP Admin</h1>
        </div>
                <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="/centro-de-jubilados-primavera/public/views/dashboard/index.html" class="block p-2 rounded hover:bg-green-700">Dashboard</a>
            <a href="/centro-de-jubilados-primavera/public/views/socios/padron.html" class="block p-2 rounded hover:bg-green-700">Socios</a>
            <a href="/centro-de-jubilados-primavera/public/views/pagos/listado.html" class="block p-2 rounded hover:bg-green-700">Cobranza</a>
            <a href="/centro-de-jubilados-primavera/public/views/planillas/generar.html" class="block p-2 rounded bg-green-700">Planillas y Ruteo</a>
            <a href="/centro-de-jubilados-primavera/public/views/notificaciones/index.html" class="block p-2 rounded hover:bg-green-700">Notificaciones</a>
            <a href="/centro-de-jubilados-primavera/public/views/auditoria/index.html" class="block p-2 rounded hover:bg-green-700">Auditoría</a>
            <a href="/centro-de-jubilados-primavera/public/views/usuarios/index.html" class="block p-2 rounded hover:bg-green-700">Usuarios</a>
            <a href="/centro-de-jubilados-primavera/public/views/deuda/configuracion-cuota.html" class="block p-2 rounded hover:bg-green-700">Configuración</a>
        </nav>
        <div class="p-4 bg-green-900 border-t border-green-700">
            <button onclick="logout()" class="w-full text-left p-2 hover:bg-green-700 rounded text-red-300">Cerrar Sesión</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h2 class="text-xl font-semibold text-gray-800">Histórico de Planillas</h2>
        </header>

        <div class="flex-1 overflow-auto p-6">
            <!-- Filtros -->
            <div class="bg-white p-4 rounded shadow mb-6">
                <form id="formFiltros" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div>
                        <label class="block text-sm text-gray-700">Zona</label>
                        <select id="zonaFilter" class="mt-1 block w-full rounded border-gray-300"></select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-700">Cobrador</label>
                        <select id="cobradorFilter" class="mt-1 block w-full rounded border-gray-300"></select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-700">Fecha Desde</label>
                        <input type="date" id="fechaDesdeFilter" class="mt-1 block w-full rounded border-gray-300">
                    </div>
                    <div>
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded w-full hover:bg-blue-700">Filtrar</button>
                    </div>
                </form>
            </div>

            <!-- Tabla -->
            <div class="bg-white rounded shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha Gen.</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Zona</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cobrador</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Socios</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPlanillas" class="bg-white divide-y divide-gray-200">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
            
            <div class="mt-4 flex justify-center space-x-2" id="paginacion">
                <!-- Paginación -->
            </div>
        </div>
    </main>

    <script>
        const BASE_URL = '/centro-de-jubilados-primavera/public';
        const API_BASE = BASE_URL + '/api';
        let currentPage = 1;

        async function init() {
            const [zonasRes, cobradoresRes] = await Promise.all([
                fetch(`${API_BASE}/zonas`),
                fetch(`${API_BASE}/planillas/cobradores`)
            ]);
            
            const zonasData = await zonasRes.json();
            const cobData = await cobradoresRes.json();
            
            const zonaSelect = document.getElementById('zonaFilter');
            zonaSelect.innerHTML = '<option value="">Todas</option>';
            zonasData.data.forEach(z => {
                const option = document.createElement('option');
                option.value = z.id;
                option.textContent = z.nombre;
                zonaSelect.appendChild(option);
            });

            const cobradorSelect = document.getElementById('cobradorFilter');
            cobradorSelect.innerHTML = '<option value="">Todos</option>';
            cobData.data.forEach(c => {
                const option = document.createElement('option');
                option.value = c.id;
                option.textContent = `${c.apellido}, ${c.nombre}`;
                cobradorSelect.appendChild(option);
            });

            document.getElementById('formFiltros').addEventListener('submit', (e) => {
                e.preventDefault();
                currentPage = 1;
                loadPlanillas();
            });

            loadPlanillas();
        }

        async function loadPlanillas() {
            const zona = document.getElementById('zonaFilter').value;
            const cobrador = document.getElementById('cobradorFilter').value;
            const desde = document.getElementById('fechaDesdeFilter').value;
            
            let url = `${API_BASE}/planillas?page=${currentPage}`;
            if (zona) url += `&zona_id=${zona}`;
            if (cobrador) url += `&cobrador_id=${cobrador}`;
            if (desde) url += `&fecha_desde=${desde}`;

            const res = await fetch(url);
            const data = await res.json();
            
            const tbody = document.getElementById('tablaPlanillas');
            tbody.innerHTML = '';
            
            if (data.success && data.data.data.length > 0) {
                data.data.data.forEach(p => {
                    const tr = document.createElement('tr');
                    const fecha = new Date(p.fecha_generacion).toLocaleString();
                    
                    tr.innerHTML = `
                        <td class="px-6 py-4 text-sm">${fecha}</td>
                        <td class="px-6 py-4 text-sm">${p.zona_nombre}</td>
                        <td class="px-6 py-4 text-sm">${p.cobrador_apellido}, ${p.cobrador_nombre}</td>
                        <td class="px-6 py-4 text-sm">${p.cantidad_socios}</td>
                        <td class="px-6 py-4 text-sm">
                            <a href="${API_BASE}/planillas/${p.id}/pdf" target="_blank" class="text-blue-600 hover:underline">Ver PDF</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                renderPagination(data.data.paginas, currentPage);
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No hay planillas.</td></tr>';
                document.getElementById('paginacion').innerHTML = '';
            }
        }

        function renderPagination(total, current) {
            const container = document.getElementById('paginacion');
            container.innerHTML = '';
            
            for (let i = 1; i <= total; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `px-3 py-1 rounded border ${i === current ? 'bg-blue-600 text-white' : 'bg-white hover:bg-gray-100'}`;
                btn.onclick = () => {
                    currentPage = i;
                    loadPlanillas();
                };
                container.appendChild(btn);
            }
        }

        function logout() {
            fetch(`${BASE_URL}/api/auth/logout`, {method: 'POST'})
                .then(() => window.location.href = `${BASE_URL}/views/auth/login.html`);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
