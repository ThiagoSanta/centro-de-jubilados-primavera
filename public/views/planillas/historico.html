        .sidebar__footer {

        .sidebar__footer-btn {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            color: #fca5a5;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 140px;
            gap: 1.25rem;
            align-items: flex-end;
        }
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <div class="sidebar__brand-title">Centro Primavera</div>
                <div class="sidebar__brand-sub">Sistema de Gestión</div>
            </div>
            <nav class="sidebar__nav">
                <a href="/centro-de-jubilados-primavera/public/views/dashboard/index.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    Dashboard
                </a>
                <a href="/centro-de-jubilados-primavera/public/views/socios/padron.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Socios
                </a>
                <a href="/centro-de-jubilados-primavera/public/views/pagos/listado.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Cobranza
                </a>
                <a href="/centro-de-jubilados-primavera/public/views/planillas/generar.html" class="sidebar-nav-item sidebar-nav-item--active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    Planillas y Ruteo
                </a>
                <a href="/centro-de-jubilados-primavera/public/views/notificaciones/index.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    Notificaciones
                </a>
                <a href="/centro-de-jubilados-primavera/public/views/auditoria/index.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    Auditoría

                <a href="/centro-de-jubilados-primavera/public/views/usuarios/index.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Usuarios
                </a>
                <a href="/centro-de-jubilados-primavera/public/views/deuda/configuracion-cuota.html" class="sidebar-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Configuración
                </a>
            </nav>
            <div class="sidebar__footer">
                <button onclick="logout()" class="sidebar-nav-item sidebar__footer-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main class="content">
            <div class="content__header">
                <div>
                    <h1 class="content__title">Histórico de Planillas</h1>
                    <p class="content__subtitle">Consulte y descargue planillas generadas anteriormente</p>
                </div>
            </div>

            <!-- Filtros -->
            <div class="card form-card">
                <form id="formFiltros">
                    <div class="form-grid">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label" for="zonaFilter">Zona</label>
                            <select id="zonaFilter" class="form-control"></select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label" for="cobradorFilter">Cobrador</label>
                            <select id="cobradorFilter" class="form-control"></select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label" for="fechaDesdeFilter">Fecha Desde</label>
                            <input type="date" id="fechaDesdeFilter" class="form-control">
                        </div>
                        <div>
                            <button type="submit" class="btn btn--primary" style="width: 100%;">Filtrar</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Tabla -->
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Fecha Gen.</th>
                            <th>Zona</th>
                            <th>Cobrador</th>
                            <th>Socios</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPlanillas">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
            
            <div class="pagination" style="justify-content: center; display: flex; gap: 0.5rem; margin-top: 1rem;" id="paginacion">
                <!-- Paginación -->
            </div>
        </main>
    </div>

    <script>
        let currentPage = 1;

        async function init() {
            const [zonasRes, cobradoresRes] = await Promise.all([
                fetch(`${API_BASE}/zonas`),
                fetch(`${API_BASE}/planillas/cobradores`)
            ]);
            
            const zonasData = await zonasRes.json();
            const cobData = await cobradoresRes.json();
            
            const zonaSelect = document.getElementById('zonaFilter');
            zonaSelect.innerHTML = '<option value="">Todas</option>';
            zonasData.data.forEach(z => {
                const option = document.createElement('option');
                option.value = z.id;
                option.textContent = z.nombre;
                zonaSelect.appendChild(option);
            });

            const cobradorSelect = document.getElementById('cobradorFilter');
            cobradorSelect.innerHTML = '<option value="">Todos</option>';
            cobData.data.forEach(c => {
                const option = document.createElement('option');
                option.value = c.id;
                option.textContent = `${c.apellido}, ${c.nombre}`;
                cobradorSelect.appendChild(option);
            });

            document.getElementById('formFiltros').addEventListener('submit', (e) => {
                e.preventDefault();
                currentPage = 1;
                loadPlanillas();
            });

            loadPlanillas();
        }

        async function loadPlanillas() {
            const zona = document.getElementById('zonaFilter').value;
            const cobrador = document.getElementById('cobradorFilter').value;
            const desde = document.getElementById('fechaDesdeFilter').value;
            
            let url = `${API_BASE}/planillas?page=${currentPage}`;
            if (zona) url += `&zona_id=${zona}`;
            if (cobrador) url += `&cobrador_id=${cobrador}`;
            if (desde) url += `&fecha_desde=${desde}`;

            const res = await fetch(url);
            const data = await res.json();
            
            const tbody = document.getElementById('tablaPlanillas');
            tbody.innerHTML = '';
            
            if (data.success && data.data.data.length > 0) {
                data.data.data.forEach(p => {
                    const tr = document.createElement('tr');
                    const fecha = new Date(p.fecha_generacion).toLocaleString();
                    
                    tr.innerHTML = `
                        <td>${fecha}</td>
                        <td>${p.zona_nombre}</td>
                        <td>${p.cobrador_apellido}, ${p.cobrador_nombre}</td>
                        <td>${p.cantidad_socios}</td>
                        <td>
                            <a href="${API_BASE}/planillas/${p.id}/pdf" target="_blank" class="btn btn--primary btn--sm">Ver PDF</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                renderPagination(data.data.paginas, currentPage);
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--color-text-muted); padding: 2rem;">No hay planillas.</td></tr>';
                document.getElementById('paginacion').innerHTML = '';
            }
        }

        function renderPagination(total, current) {
            const container = document.getElementById('paginacion');
            container.innerHTML = '';
            
            for (let i = 1; i <= total; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `btn btn--sm ${i === current ? 'btn--primary' : 'btn--secondary'}`;
                btn.onclick = () => {
                    currentPage = i;
                    loadPlanillas();
                };
                container.appendChild(btn);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
