<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría — Centro de Jubilados Primavera</title>
    <meta name="description" content="Registro de auditoría del sistema de gestión del Centro de Jubilados Primavera.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/centro-de-jubilados-primavera/public/assets/css/main.css">
    <script src="/centro-de-jubilados-primavera/public/assets/js/app.js"></script>
    <style>
        /*
         * Equivalencias mínimas para las clases Tailwind usadas literalmente
         * en renderTable() — el JS NO se modifica.
         * Cada clase recibe su propia regla para máxima especificidad y claridad.
         * Variables: --color-accent, --color-text-muted, --color-estado-eliminado,
         *            --color-estado-activo (todas definidas en main.css :root).
         */

        /* Layout y display */
        .inline-flex   { display: inline-flex; align-items: center; }
        .block         { display: block; }
        .whitespace-nowrap { white-space: nowrap; }
        .truncate      { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Tipografía */
        .text-xs       { font-size: 0.75rem; line-height: 1rem; }
        .leading-5     { line-height: 1.25rem; }
        .font-semibold { font-weight: 600; }

        /* Colores de texto — mapeados a variables del proyecto */
        .text-gray-400  { color: var(--color-text-muted); opacity: 0.75; }
        .text-gray-500  { color: var(--color-text-muted); }
        .text-blue-800  { color: var(--color-accent); }
        .text-red-500   { color: var(--color-estado-eliminado); }
        .text-green-500 { color: var(--color-estado-activo); }

        /* Colores de fondo — badge de acción */
        .bg-blue-100   { background-color: rgba(59, 130, 246, 0.12); }

        /* Bordes y radios */
        .rounded-full  { border-radius: 9999px; }

        /* Espaciado — padding/margin usados en las celdas */
        .px-2 { padding-left: 0.5rem;  padding-right: 0.5rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .py-2 { padding-top: 0.5rem;   padding-bottom: 0.5rem; }
        .mt-1 { margin-top: 0.25rem; }

        /* Dimensiones */
        .max-w-xs { max-width: 20rem; }
    </style>
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar__brand">
            <div class="sidebar__brand-title">Centro Primavera</div>
            <div class="sidebar__brand-sub">Sistema de Gestión</div>
        </div>
        <nav class="sidebar__nav">
            <a href="/centro-de-jubilados-primavera/public/views/dashboard/index.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Dashboard
            </a>
            <a href="/centro-de-jubilados-primavera/public/views/socios/padron.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Socios
            </a>
            <a href="/centro-de-jubilados-primavera/public/views/pagos/listado.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Cobranza
            </a>
            <a href="/centro-de-jubilados-primavera/public/views/planillas/generar.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                Planillas y Ruteo
            </a>
            <a href="/centro-de-jubilados-primavera/public/views/notificaciones/index.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                Notificaciones
            </a>
            <a href="/centro-de-jubilados-primavera/public/views/auditoria/index.html" class="sidebar-nav-item sidebar-nav-item--active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Auditoría
            </a>
            <a href="/centro-de-jubilados-primavera/public/views/usuarios/index.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Usuarios
            </a>
            <a href="/centro-de-jubilados-primavera/public/views/deuda/configuracion-cuota.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Configuración
            </a>
        </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="content">
        <div class="content__header">
            <div>
                <h1 class="content__title">Registro de Auditoría</h1>
                <p class="content__subtitle">Historial de eventos del sistema</p>
            </div>
        </div>

        <div id="alertContainer"></div>

        <!-- Filtros -->
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem;">
            <input type="text" id="filterUsuario" placeholder="ID Usuario" class="input" style="width:140px;">
            <input type="text" id="filterAccion" placeholder="Acción (ej. crear_socio)" class="input" style="width:200px;">
            <select id="filterEntidad" class="input" style="width:160px;">
                <option value="">Todas las entidades</option>
                <option value="socios">Socios</option>
                <option value="pagos">Pagos</option>
                <option value="deudas">Deudas</option>
                <option value="planillas">Planillas</option>
                <option value="observaciones">Observaciones</option>
            </select>
            <input type="date" id="filterDesde" class="input">
            <input type="date" id="filterHasta" class="input">
            <button onclick="currentPage=1; fetchAuditoria()" class="btn btn--primary">Filtrar</button>
            <button onclick="limpiarFiltros()" class="btn btn--secondary">Limpiar</button>
        </div>

        <!-- Tabla de auditoría -->
        <div class="table-wrapper">
            <table class="table">
                <thead>
                    <tr>
                        <th>Fecha/Hora</th>
                        <th>Usuario</th>
                        <th>Acción / Entidad</th>
                        <th>Valores (Ant → Nuevo)</th>
                        <th>Motivo</th>
                    </tr>
                </thead>
                <tbody id="tablaAuditoria">
                    <!-- JS populate -->
                </tbody>
            </table>
        </div>

        <!-- Paginación -->
        <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem 0; margin-top:0.5rem;">
            <button onclick="changePage(-1)" class="btn btn--secondary">Anterior</button>
            <span id="pageInfo" style="font-size:0.875rem; color:var(--color-text-muted);">Página 1</span>
            <button onclick="changePage(1)" class="btn btn--secondary">Siguiente</button>
        </div>
    </main>

</div>

    <script>
        let currentPage = 1;
        let totalPages = 1;

        async function fetchAuditoria() {
            const params = new URLSearchParams();
            params.append('pagina', currentPage);
            
            const u = document.getElementById('filterUsuario').value;
            const a = document.getElementById('filterAccion').value;
            const e = document.getElementById('filterEntidad').value;
            const d = document.getElementById('filterDesde').value;
            const h = document.getElementById('filterHasta').value;

            if (u) params.append('usuario_id', u);
            if (a) params.append('accion', a);
            if (e) params.append('entidad_afectada', e);
            if (d) params.append('fecha_desde', d);
            if (h) params.append('fecha_hasta', h);

            try {
                const res = await fetch(`${API_BASE}/auditoria?${params.toString()}`);
                const data = await res.json();
                if (data.success) {
                    renderTable(data.data.items || []);
                    totalPages = (data.data.meta && data.data.meta.paginas) || 1;
                    document.getElementById('pageInfo').innerText = `Página ${currentPage} de ${totalPages}`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderTable(list) {
            const tbody = document.getElementById('tablaAuditoria');
            tbody.innerHTML = '';
            
            list.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-3 py-2 whitespace-nowrap text-xs text-gray-500">${new Date(item.fecha_hora).toLocaleString()}</td>
                    <td class="px-3 py-2 whitespace-nowrap">${item.usuario_nombre || ''} ${item.usuario_apellido || ''} <span class="text-xs text-gray-400 block">${item.usuario_id}</span></td>
                    <td class="px-3 py-2 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">${item.accion}</span>
                        <div class="text-xs text-gray-500 mt-1">${item.entidad_afectada}</div>
                    </td>
                    <td class="px-3 py-2 text-xs text-gray-500 max-w-xs truncate" title="${item.valor_anterior} -> ${item.valor_nuevo}">
                        <div class="text-red-500 truncate">- ${item.valor_anterior || 'N/A'}</div>
                        <div class="text-green-500 truncate">+ ${item.valor_nuevo || 'N/A'}</div>
                    </td>
                    <td class="px-3 py-2 text-xs text-gray-500">${item.motivo || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                fetchAuditoria();
            }
        }

        function limpiarFiltros() {
            document.getElementById('filterUsuario').value = '';
            document.getElementById('filterAccion').value = '';
            document.getElementById('filterEntidad').value = '';
            document.getElementById('filterDesde').value = '';
            document.getElementById('filterHasta').value = '';
            currentPage = 1;
            fetchAuditoria();
        }

        document.addEventListener('DOMContentLoaded', function () {
            fetch(API_BASE + '/auth/me')
                .then(function (res) {
                    if (!res.ok) throw new Error('No autenticado');
                    return res.json();
                })
                .then(function (res) {
                    if (!res.success || !res.data) {
                        window.location.href = BASE_URL + '/views/auth/login.html';
                        return;
                    }
                    var user = res.data;
                    if (user.rol !== 'administrador') {
                        window.location.replace(user.rol === 'cobrador'
                            ? BASE_URL + '/views/cobrador/index.html'
                            : BASE_URL + '/views/auth/login.html');
                        return;
                    }
                    fetchAuditoria();
                })
                .catch(function () {
                    window.location.replace(BASE_URL + '/views/auth/login.html');
                });
        });
    </script>
</body>
</html>
