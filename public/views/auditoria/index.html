<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría - CJP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-green-800 text-white flex flex-col">
        <div class="p-4 bg-green-900">
            <h1 class="text-xl font-bold">CJP Admin</h1>
        </div>
                <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="/centro-de-jubilados-primavera/public/views/dashboard/index.html" class="block p-2 rounded hover:bg-green-700">Dashboard</a>
            <a href="/centro-de-jubilados-primavera/public/views/socios/padron.html" class="block p-2 rounded hover:bg-green-700">Socios</a>
            <a href="/centro-de-jubilados-primavera/public/views/pagos/listado.html" class="block p-2 rounded hover:bg-green-700">Cobranza</a>
            <a href="/centro-de-jubilados-primavera/public/views/planillas/generar.html" class="block p-2 rounded hover:bg-green-700">Planillas y Ruteo</a>
            <a href="/centro-de-jubilados-primavera/public/views/notificaciones/index.html" class="block p-2 rounded hover:bg-green-700">Notificaciones</a>
            <a href="/centro-de-jubilados-primavera/public/views/auditoria/index.html" class="block p-2 rounded bg-green-700">Auditoría</a>
            <a href="/centro-de-jubilados-primavera/public/views/usuarios/index.html" class="block p-2 rounded hover:bg-green-700">Usuarios</a>
            <a href="/centro-de-jubilados-primavera/public/views/deuda/configuracion-cuota.html" class="block p-2 rounded hover:bg-green-700">Configuración</a>
        </nav>
        <div class="p-4 bg-green-900 border-t border-green-700">
            <button onclick="logout()" class="w-full text-left p-2 hover:bg-green-700 rounded text-red-300">Cerrar Sesión</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h2 class="text-xl font-semibold text-gray-800">Registro de Auditoría</h2>
        </header>

        <div class="p-4 bg-white border-b flex space-x-2 text-sm">
            <input type="text" id="filterUsuario" placeholder="ID Usuario" class="border rounded p-1">
            <input type="text" id="filterAccion" placeholder="Acción (ej. crear_socio)" class="border rounded p-1">
            <select id="filterEntidad" class="border rounded p-1">
                <option value="">Todas las entidades</option>
                <option value="socios">Socios</option>
                <option value="pagos">Pagos</option>
                <option value="deudas">Deudas</option>
                <option value="planillas">Planillas</option>
                <option value="observaciones">Observaciones</option>
            </select>
            <input type="date" id="filterDesde" class="border rounded p-1">
            <input type="date" id="filterHasta" class="border rounded p-1">
            <button onclick="currentPage=1; fetchAuditoria()" class="bg-blue-600 text-white px-3 py-1 rounded">Filtrar</button>
            <button onclick="limpiarFiltros()" class="bg-gray-200 px-3 py-1 rounded">Limpiar</button>
        </div>

        <div class="flex-1 overflow-auto p-4">
            <div class="bg-white rounded shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Fecha/Hora</th>
                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Usuario</th>
                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Acción / Entidad</th>
                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Valores (Ant → Nuevo)</th>
                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Motivo</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAuditoria" class="bg-white divide-y divide-gray-200 text-sm">
                        <!-- JS populate -->
                    </tbody>
                </table>
            </div>
            
            <div class="mt-4 flex justify-between items-center bg-white p-3 rounded shadow">
                <button onclick="changePage(-1)" class="px-3 py-1 border rounded hover:bg-gray-100">Anterior</button>
                <span id="pageInfo" class="text-sm text-gray-600">Página 1</span>
                <button onclick="changePage(1)" class="px-3 py-1 border rounded hover:bg-gray-100">Siguiente</button>
            </div>
        </div>
    </main>

    <script>
        const BASE_URL = '/centro-de-jubilados-primavera/public';
        const API_BASE = BASE_URL + '/api';
        let currentPage = 1;
        let totalPages = 1;

        async function fetchAuditoria() {
            const params = new URLSearchParams();
            params.append('pagina', currentPage);
            
            const u = document.getElementById('filterUsuario').value;
            const a = document.getElementById('filterAccion').value;
            const e = document.getElementById('filterEntidad').value;
            const d = document.getElementById('filterDesde').value;
            const h = document.getElementById('filterHasta').value;

            if (u) params.append('usuario_id', u);
            if (a) params.append('accion', a);
            if (e) params.append('entidad_afectada', e);
            if (d) params.append('fecha_desde', d);
            if (h) params.append('fecha_hasta', h);

            try {
                const res = await fetch(`${API_BASE}/auditoria?${params.toString()}`);
                const data = await res.json();
                if (data.success) {
                    renderTable(data.data);
                    totalPages = data.meta.paginas || 1;
                    document.getElementById('pageInfo').innerText = `Página ${currentPage} de ${totalPages}`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderTable(list) {
            const tbody = document.getElementById('tablaAuditoria');
            tbody.innerHTML = '';
            
            list.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-3 py-2 whitespace-nowrap text-xs text-gray-500">${new Date(item.fecha_hora).toLocaleString()}</td>
                    <td class="px-3 py-2 whitespace-nowrap">${item.usuario_nombre || ''} ${item.usuario_apellido || ''} <span class="text-xs text-gray-400 block">${item.usuario_id}</span></td>
                    <td class="px-3 py-2 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">${item.accion}</span>
                        <div class="text-xs text-gray-500 mt-1">${item.entidad_afectada}</div>
                    </td>
                    <td class="px-3 py-2 text-xs text-gray-500 max-w-xs truncate" title="${item.valor_anterior} -> ${item.valor_nuevo}">
                        <div class="text-red-500 truncate">- ${item.valor_anterior || 'N/A'}</div>
                        <div class="text-green-500 truncate">+ ${item.valor_nuevo || 'N/A'}</div>
                    </td>
                    <td class="px-3 py-2 text-xs text-gray-500">${item.motivo || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                fetchAuditoria();
            }
        }

        function limpiarFiltros() {
            document.getElementById('filterUsuario').value = '';
            document.getElementById('filterAccion').value = '';
            document.getElementById('filterEntidad').value = '';
            document.getElementById('filterDesde').value = '';
            document.getElementById('filterHasta').value = '';
            currentPage = 1;
            fetchAuditoria();
        }

        function logout() {
            fetch(`${BASE_URL}/api/auth/logout`, {method: 'POST'})
                .then(() => window.location.href = `${BASE_URL}/views/auth/login.html`);
        }

        document.addEventListener('DOMContentLoaded', fetchAuditoria);
    </script>
</body>
</html>
